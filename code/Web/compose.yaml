services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smart_parking
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - parking_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d smart_parking"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  parking_data:
